<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Viewer 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@3.5.0/dist/model-viewer.min.js"></script>
<style>
  :root {
    --bg: #e9eef1;
    --surface: #f7f9fa;
    --ink: #14202b;
    --muted: #55656f;
    --steel: #17324a;
    --accent: #2f7f86;
    --nav-h: 56px;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1a22;
      --surface: #16252f;
      --ink: #e6edf1;
      --muted: #94a5af;
      --steel: #0b141b;
      --accent: #5fb3ba;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--ink);
    line-height: 1.55;
  }
  a:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* Navbar */
  .nav {
    position: fixed; top: 0; left: 0; right: 0; height: var(--nav-h);
    background: var(--steel); color: #f2f6f8;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 20px; z-index: 10;
    border-bottom: 3px solid var(--accent);
  }
  .brand { font-weight: 600; font-size: 1.05rem; letter-spacing: .01em; color: inherit; text-decoration: none; }
  .menu { display: flex; gap: 4px; margin: 0; padding: 0; list-style: none; }
  .menu a {
    display: block; padding: 8px 14px; border-radius: 4px;
    color: #c9d6dd; text-decoration: none; font-size: .95rem;
  }
  .menu a:hover { color: #fff; background: rgba(255,255,255,.08); }
  .menu a[aria-current="page"] { color: #fff; background: rgba(255,255,255,.14); }
  .toggle {
    display: none; background: none; border: 1px solid rgba(255,255,255,.35);
    color: #fff; padding: 6px 12px; border-radius: 4px; font: inherit; cursor: pointer;
  }

  /* Viewer */
  main { padding-top: var(--nav-h); height: 100%; }
  .stage { position: relative; height: 100%; background: var(--surface); }
  model-viewer { width: 100%; height: 100%; --poster-color: transparent; background: var(--surface); }
  .progress { position: absolute; left: 0; right: 0; top: 0; height: 3px; }
  .progress span { display: block; height: 100%; width: 0; background: var(--accent); transition: width .15s linear; }
  .progress.done { opacity: 0; transition: opacity .4s; }
  .status {
    position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
    text-align: center; padding: 24px; color: var(--muted); background: var(--surface);
  }
  .status.show { display: flex; }
  .caption {
    position: absolute; left: 16px; top: 14px; font-weight: 500; font-size: 1rem;
    background: color-mix(in srgb, var(--surface) 85%, transparent);
    padding: 6px 10px; border-radius: 4px; pointer-events: none;
  }
  .hint {
    position: absolute; left: 16px; bottom: 16px; font-size: .85rem; color: var(--muted);
    background: color-mix(in srgb, var(--surface) 85%, transparent);
    padding: 6px 10px; border-radius: 4px; pointer-events: none;
  }

  @media (max-width: 640px) {
    .toggle { display: block; }
    .menu {
      display: none; position: absolute; top: var(--nav-h); left: 0; right: 0;
      flex-direction: column; background: var(--steel); padding: 8px 12px 12px;
      border-bottom: 3px solid var(--accent);
    }
    .menu.open { display: flex; }
    .hint { display: none; }
  }
</style>
</head>
<body>

<header class="nav">
  <a class="brand" href="#" id="brand">Viewer 3D</a>
  <button class="toggle" id="toggle" aria-expanded="false" aria-controls="menu">Menu</button>
  <ul class="menu" id="menu"></ul>
</header>

<main>
  <div class="stage">
    <div class="progress" id="progress"><span id="bar"></span></div>
    <model-viewer
      id="viewer"
      alt="Model 3D"
      camera-controls
      touch-action="pan-y"
      shadow-intensity="0.6"
      exposure="1"
      interaction-prompt="none">
    </model-viewer>
    <div class="caption" id="caption"></div>
    <div class="status" id="status" role="status"></div>
    <div class="hint">Seret untuk memutar. Gulir atau cubit untuk zoom. Klik kanan atau dua jari untuk menggeser.</div>
  </div>
</main>

<script>
  // ====== EDIT DI SINI: daftar model yang ditampilkan ======
  // id: dipakai di alamat (#id). label: teks di navbar. src: lokasi file GLB.
  const MODELS = [
    { id: 'model-1', label: 'Model 1', src: 'model-1.glb' },
    { id: 'model-2', label: 'Model 2', src: 'model-2.glb' },
    { id: 'model-3', label: 'Model 3', src: 'model-3.glb' },
  ];
  // =========================================================

  const menu = document.getElementById('menu');
  const toggle = document.getElementById('toggle');
  const viewer = document.getElementById('viewer');
  const bar = document.getElementById('bar');
  const progress = document.getElementById('progress');
  const status = document.getElementById('status');
  const caption = document.getElementById('caption');
  const brand = document.getElementById('brand');

  // Bangun menu dari daftar MODELS
  MODELS.forEach(m => {
    const li = document.createElement('li');
    const a = document.createElement('a');
    a.href = '#' + m.id;
    a.textContent = m.label;
    li.appendChild(a);
    menu.appendChild(li);
  });
  brand.href = '#' + MODELS[0].id;

  let currentId = null;

  function show() {
    const wanted = location.hash.slice(1);
    const model = MODELS.find(m => m.id === wanted) || MODELS[0];

    menu.querySelectorAll('a').forEach(a => {
      if (a.getAttribute('href') === '#' + model.id) a.setAttribute('aria-current', 'page');
      else a.removeAttribute('aria-current');
    });
    menu.classList.remove('open');
    toggle.setAttribute('aria-expanded', 'false');

    if (model.id === currentId) return;
    currentId = model.id;

    // Hanya satu viewer aktif: model lama dilepas, model baru dimuat.
    status.classList.remove('show');
    progress.classList.remove('done');
    bar.style.width = '0';
    caption.textContent = model.label;
    document.title = model.label + ' | Viewer 3D';
    viewer.alt = 'Model 3D: ' + model.label;
    viewer.src = model.src;
    status.textContent = 'File ' + model.src + ' tidak dapat dimuat. Pastikan berkas ada di folder tersebut dan halaman dibuka lewat server (bukan file://).';
  }

  window.addEventListener('hashchange', show);
  show();

  toggle.addEventListener('click', () => {
    const open = menu.classList.toggle('open');
    toggle.setAttribute('aria-expanded', String(open));
  });

  viewer.addEventListener('progress', e => {
    bar.style.width = Math.round(e.detail.totalProgress * 100) + '%';
  });
  viewer.addEventListener('load', () => progress.classList.add('done'));
  viewer.addEventListener('error', () => {
    progress.classList.add('done');
    status.classList.add('show');
  });
</script>
</body>
</html>
